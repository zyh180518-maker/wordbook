name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure stable signing
        run: |
          cp android-signing/debug.keystore android/app/debug.keystore
          python3 scripts/patch-signing.py

      - name: Set version from tag
        run: python3 scripts/patch-version.py

      - name: Inject native TTS bridge
        run: python3 scripts/patch-tts.py

      - name: Inject APK updater bridge
        run: python3 scripts/patch-updater.py

      - name: Generate icons and splash
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wordbook-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Generate hot-update assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-assets.py

      - name: Commit hot-update assets to main (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/latest.json www/index-*.html
          git commit -m "chore: release hot-update assets ${{ github.ref_name }}" || echo "no changes to commit"
          git push origin HEAD:main || echo "push to main failed (non-fast-forward), gh-pages deploy continues"

      - name: Deploy hot-update assets to GitHub Pages (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p _pages
          cp www/latest.json www/index-*.html _pages/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp _pages/latest.json _pages/index-*.html .
          git add latest.json index-*.html
          git commit -m "Deploy hot-update assets ${{ github.ref_name }}" || echo "no changes to commit"
          git push origin gh-pages --force
